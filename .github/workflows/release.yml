name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH format" >&2
            exit 1
          fi

      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build production image
        run: |
          VERSION="${RELEASE_TAG#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --build-arg VERSION="$VERSION" \
            --build-arg REVISION="$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.title=netbird-notifier" \
            --label "org.opencontainers.image.description=Email event notifier for self-hosted NetBird" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.url=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.licenses=MIT" \
            --label "org.opencontainers.image.version=$VERSION" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            -t "netbird-notifier:$VERSION" \
            -t "$IMAGE:$VERSION" .

      - name: Build and run test image
        run: |
          VERSION="${RELEASE_TAG#v}"
          docker build --build-arg "RUNTIME_IMAGE=netbird-notifier:$VERSION" \
            -f Dockerfile.test -t netbird-notifier-tests:release .
          docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --pids-limit 64 --memory 256m \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m netbird-notifier-tests:release

      - name: Publish container image
        shell: bash
        run: |
          VERSION="${RELEASE_TAG#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image tag $IMAGE:$VERSION" >&2
            exit 1
          fi
          docker push "$IMAGE:$VERSION"
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:latest"

      - name: Publish GitHub release
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG is already published"
            exit 0
          fi
          cat > release-notes.md <<'EOF'
          Independent email event notifier for self-hosted NetBird.

          Highlights:
          - Read-only alerts for pending users, joined users, new service users and new peers
          - Pending-user alerts rearm after a successful poll sees the user leave the pending state
          - Peer-added alerts include the API-supplied public connection IP when valid
          - Silent baselines for creation-event detection
          - Provider-agnostic SMTP with STARTTLS or implicit TLS
          - Optional sender display name
          - Persistent per-recipient deduplication in SQLite
          - Hardened non-root Docker Compose deployment
          - Configuration checks, dry-run, test-email and healthcheck modes

          Tested with self-hosted NetBird Management v0.78.1 and Zoho SMTP. See `docs/validation.md` for the full validation record and `SECURITY.md` for deployment guidance and residual risks.

          This community project is not affiliated with or endorsed by NetBird.
          EOF
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "netbird-notifier ${RELEASE_TAG#v}" \
            --notes-file release-notes.md
